# ============================================================
# Stage-4 pybhpt-Supervised Training
# ============================================================
# Loss = w_sup * |R_in_model/P - R_in_pybhpt/P|^2 + w_pde * |PDE_residual|^2
# w_sup decays per epoch: w_sup *= supervision_decay
# Only RinDecoder trainable. Encoder + AmplitudeNet frozen.
# ============================================================

include:
  physics: config/teukolsky_radial.yaml

model:
  hidden_dims: [128, 128, 128, 128]
  activation: silu
  fourier_num_freqs: 2
  fourier_base_scale: 1.0
  param_embed_dim: 64
  use_film: true
  use_residual: true
  amp_hidden_dim: 128
  amp_n_blocks: 3
  decoder_hidden_dim: 128
  decoder_n_hidden: 0

stage4_pybhpt:
  # Checkpoints
  stage1_checkpoint: outputs/pre_stage4_bundle/patch_000_logw_v2/stage1_best_model.pt

  # Pre-computed pybhpt references
  pybhpt_references: outputs/pybhpt_reference_cache/patch_000_logw_v2/pybhpt_references.npz

  # Freeze policy: only RinDecoder trainable
  freeze:
    train_encoder: false
    train_rin_decoder: true
    train_up_decoder: false
    train_down_decoder: false
    train_amplitude_net: false

  # Optimizer
  optimizer:
    lr: 5.0e-6
    weight_decay: 0.0
    grad_clip: 0.1

  # Training
  epochs: 500
  batch_size: 4

  # Loss weights: total = w_sup * L_sup + w_pde * L_pde
  loss:
    weight_supervision: 1.0          # Initial w_sup (L_sup ~ 3e3, term ~ 3e3)
    supervision_decay: 0.995         # Multiply w_sup by this each epoch (slow decay)
    supervision_min: 0.01            # Floor for w_sup
    weight_pde: 1.0                  # Fixed w_pde (L_pde ~ 10, term ~ 10)

  # Near-infinity biased sampling
  sampling:
    near_core:
      y_min: -0.999
      y_max: -0.95
      n_y: 96
    transition:
      y_min: -0.95
      y_max: -0.5
      n_y: 32

  # Output
  output_root: outputs/autoencoder_stage4_pybhpt_supervised
  save_every_epochs: 50

runtime:
  dtype: float64
