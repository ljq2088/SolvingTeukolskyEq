include:
  physics: config/teukolsky_radial.yaml

# ============================================================
# Phase 1: 在原config基础上保守优化
# 保持warmstart + 原架构，只调loss权重/steps/LR
# ============================================================

initialization:
  enabled: true
  checkpoint: outputs/pinn/final_model_full_a_omega.pt
  load_optimizer: false
  strict: true

parameter_space:
  a:
    center: 0.5
    range: 0.499
  omega:
    center: 5.00005
    range: 4.99995
  domain:
    k_horizon_margin: 1.0e-2
    resample_factor: 4
    max_attempts: 32

model:
  hidden_dims: [128, 128, 128, 128]
  activation: silu
  fourier_num_freqs: 2
  fourier_scale: 1.0
  param_embed_dim: 64

  use_film: true
  use_residual: true

  a_min_local: 0.001
  a_max_local: 0.999
  omega_min_local: 0.0001
  omega_max_local: 10.0

sampling:
  parameter_batch:
    mode: fixed_pool
    sampler: sobol
    batch_size: 4
    n_param_samples: 32

  collocation:
    interior:
      strategy: chebyshev
      n_points: 64

    boundary:
      strategy: none
      n_points: 0

    adaptive:
      enabled: true
      candidate_method: sobol
      n_candidates: 512
      refresh_freq: 50
      adaptive_frac: 0.7
      normalize_residual: false

  anchors:
    mode: chebyshev_plus_adaptive
    n_base: 20
    n_adaptive: 5
    n_random: 0

training:
  optimizer:
    lr: 5.0e-4  # 原: 1.0e-3，降低避免破坏warmstart

  anchor:
    freq: 1
    start_step: 1
    n_anchors: 20

  scheduler:
    enabled: true
    type: exp_after_warmup
    warmup_steps: 5000
    decay_start: 1000
    decay_rate: 0.99995
    min_lr: 5.0e-5

  loss:
    weight_interior: 1.0
    weight_boundary: 0.0
    weight_anchor: 5.0e+2  # 原: 1.0e+2

  loss_balance:
    mode: fixed
    eps: 1.0e-12

  validation:
    mode: fixed_pool
    val_freq: 50
    val_n_points: 200
    n_param_samples: 16
    param_sampler: sobol
    monitor: mean
    track_worst: true
    sobol_seed: 4321
    sobol_skip: 0
    save_best_freq: 50

  early_stop:
    patience: 1000  # 原: 500
    threshold: 1.0e-6

  weight_schedule:
    anchor:
      enabled: true
      steps: 50000
      decay_enabled: true
      warmup_steps: 0
      decay_start: 1000
      decay_rate: 0.999995
      min_weight: 1.0e-3

    interior:
      enabled: true
      steps: 50000
      growth_enabled: true
      warmup_steps: 0
      growth_start: 1000
      growth_rate: 1.000005
      max_weight: 1.0

  epochs: 50000

curriculum:
  parameter:
    enabled: false
  collocation:
    enabled: false

regularization:
  anti_trivial:
    enabled: false

  dynamic_balance:
    enabled: false

  flat_variance:
    enabled: false

  head_reg:
    enabled: true
    weight_nl: 1.0e-6
    weight_resp: 1.0e-8

  param_curvature:
    enabled: true
    weight: 1.0e-4
    delta_alpha: 0.05
    delta_xi: 0.05
    n_probe_points: 32

restart:
  enabled: false

visualization:
  viz_show_enabled: true
  viz_enabled: true
  viz_every_steps: 100
  viz_auto_close_sec: 3.0
  viz_num_points: 500
  viz_r_min: 2.0
  viz_r_max: 1000.0
  viz_save_enabled: true
  viz_subdir: "viz_compare_phase1"

runtime:
  dtype: float64

mathematica:
  kernel_path: "/mnt/f/mma/WolframKernel.exe"
  wl_path_win: "F:/EMRI/Radial_flow/Radial_Function.wl"

atlas_training:
  steps: 20000  # 原: 10000
  batch_size: 8
  n_interior: 64
  n_interior_outer_extra: 8
  grad_clip: 1.0
  normalize_residual: false

  val_fraction: 0.2
  val_param_samples: 12
  val_every: 50
  val_n_points: 64

  early_stopping:
    enabled: true
    patience: 40  # 原: 20
    min_rel_improve: 5.0e-5  # 原: 1.0e-4
    min_steps: 3000  # 原: 2000

  save_every: 200
  ckpt_every: 200
  viz_every: 200
  viz_num_points: 400
  viz_r_min: 2.0
  viz_r_max: 1000.0
  anchor_backend: pybhpt
  viz_benchmark_backend: spectral
  viz_pybhpt_timeout: 10.0
  anchor_pybhpt_timeout: 10.0
  viz_spectral_N: 64
  viz_spectral_z_m: 0.3
  viz_mma_enabled: false

  anchor_target_ratio: 5.0e-3  # 原: 1.0e-2
  train_seed: 1234
  output_root: outputs/atlas_patch_train_phase1
  anchor_fail_log_name: anchor_failures.jsonl

multipatch_training:
  enabled: true
  patch_order: center_out
  warmstart_from_neighbor: true
  skip_existing: false
  resume_partial_runs: false
  reuse_existing_registry: false
  patch_steps: null
  output_root: outputs/atlas_multipatch_phase1
  registry_name: atlas_registry_phase1.json
  export_flat_models: true
  export_model_dirname: models
  max_patches: null
