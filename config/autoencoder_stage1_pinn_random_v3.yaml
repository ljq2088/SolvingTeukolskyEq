include:
  physics: config/teukolsky_radial.yaml

# ============================================================
# Autoencoder Stage 1: PDE residual only, random collocation
# v3: SGDR with base-LR decay envelope after step 10000
# Patch 0: a in [0.206,0.794], omega in [0.0085,0.0777]
# ============================================================

autoencoder:
  stage: stage1

model:
  hidden_dims: [128, 128, 128, 128]
  activation: silu
  fourier_num_freqs: 2
  fourier_base_scale: 1.0
  param_embed_dim: 64
  use_film: true
  use_residual: true
  init_from_pinn_checkpoint: "/home/ljq/code/PINN/SolvingTeukolsky/outputs/atlas_multipatch_phase4_sgdr/models/patch_000_best.pt"

sampling:
  parameter_batch:
    mode: fixed_pool
    sampler: sobol
    batch_size: 8
    n_param_samples: 96

  collocation:
    interior:
      strategy: sobol_random
      n_points: 256
      y_min: -0.9999
      y_max: 0.9999

    boundary:
      strategy: none
      n_points: 0

    adaptive:
      enabled: false

  anchors:
    mode: none
    n_base: 0
    n_adaptive: 0
    n_random: 0

training:
  optimizer:
    lr: 1.0e-3

  anchor:
    freq: 0
    start_step: 999999
    n_anchors: 0

  scheduler:
    enabled: true
    type: sgdr
    sgdr_T0: 3000
    sgdr_T_mult: 2
    sgdr_eta_min: 0.1
    # Base-LR decay envelope (linear, applied on top of SGDR cosine)
    sgdr_lr_decay_start: 10000
    sgdr_lr_decay_end: 40000
    sgdr_lr_decay_target: 0.1

  loss:
    weight_interior: 1.0
    weight_boundary: 0.0
    weight_anchor: 0.0

  loss_balance:
    mode: fixed

  validation:
    mode: fixed_pool
    val_freq: 100
    val_n_points: 256
    n_param_samples: 48
    param_sampler: sobol
    monitor: mean
    track_worst: true
    sobol_seed: 4321
    sobol_skip: 0

  early_stop:
    patience: 2000
    threshold: 1.0e-6

  weight_schedule:
    interior:
      enabled: false

  epochs: 50000

curriculum:
  parameter:
    enabled: false
  collocation:
    enabled: false

regularization:
  anti_trivial:
    enabled: false
  dynamic_balance:
    enabled: false
  flat_variance:
    enabled: false
  head_reg:
    enabled: true
    weight_nl: 1.0e-6
    weight_resp: 1.0e-8
  param_curvature:
    enabled: true
    weight: 1.0e-4
    delta_alpha: 0.05
    delta_xi: 0.05
    n_probe_points: 64

restart:
  enabled: false

visualization:
  viz_show_enabled: false
  viz_enabled: true
  viz_every_steps: 500
  viz_auto_close_sec: 3.0
  viz_num_points: 400
  viz_r_min: 2.0
  viz_r_max: 1000.0
  viz_save_enabled: true
  viz_subdir: "figures"

runtime:
  dtype: float64

mathematica:
  kernel_path: "/mnt/f/mma/WolframKernel.exe"
  wl_path_win: "F:/EMRI/Radial_flow/Radial_Function.wl"

atlas_training:
  steps: 100000
  batch_size: 8
  n_interior: 256
  n_interior_outer_extra: 0
  grad_clip: 0.5
  normalize_residual: false

  resample_params_every: 1
  resample_collocation_every: 1

  lbfgs_steps: 500

  infinity_robin_weight: 0.0

  perturb_scale: 0.05

  f_anchor_file: "outputs/stage1_retrain/f_anchors_patch0.pt"
  f_anchor_weight: 0.0

  # ---- Causal spatial training ----
  causal:
    enabled: false
    n_chunks: 8
    epsilon: 0.1
    update_freq: 100
    direction: "horizon_first"
    y_protect_above: -0.75

  # ---- F_y derivative residual: disabled ----
  fy_residual:
    enabled: false
    weight: 0.0
    n_points: 32
    strategy: chebyshev_half
    y_min: -0.9999
    y_max: 0.9999
    implementation: coefficient_autograd
    log_components: true

  val_fraction: 0.2
  val_param_samples: 48
  val_every: 100
  val_n_points: 256

  early_stopping:
    enabled: true
    patience: 500
    min_rel_improve: 1.0e-5
    min_steps: 2000

  save_every: 500
  ckpt_every: 200
  viz_every: 500
  viz_num_points: 400
  viz_r_min: 2.0
  viz_r_max: 1000.0
  anchor_backend: pybhpt
  viz_benchmark_backend: pybhpt

  val_benchmark_backend: "none"
  val_benchmark_every: 100
  val_benchmark_max_cases: 24
  val_benchmark_at_final: true

  anchor_target_ratio: 1.0e-2
  train_seed: 1234
  output_root: outputs/stage1_pinn_random_v3
