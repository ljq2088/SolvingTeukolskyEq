# ============================================================
# Autoencoder Stage 3 Refine: stabilized long training config
# ============================================================

include:
  physics: config/teukolsky_radial.yaml

autoencoder:
  stage: stage3

model:
  hidden_dims: [128, 128, 128, 128]
  activation: silu
  fourier_num_freqs: 2
  fourier_base_scale: 1.0
  param_embed_dim: 64
  use_film: true
  use_residual: true
  encoder_kwargs:
    amp_hidden_dim: 128
    amp_n_blocks: 3

stage3:
  checkpoint: null   # set via --checkpoint CLI
  artifact_dir: outputs/stage1_artifacts/patch_000_logw_v2

  train_up: true
  train_down: true
  residual_mode: u_equation

  optimizer:
    lr: 2.0e-5
    weight_decay: 0.0

  scheduler:
    enabled: true
    factor: 0.5
    patience: 200
    min_lr: 1.0e-6

  batch_size: 8
  n_interior: 128
  n_param_samples: 64
  epochs: 5000
  val_every_epochs: 50
  save_every_epochs: 500

  grad_clip: 1.0

  loss:
    weight_up: 1.0
    weight_down: 1.0

  sampling:
    y_strategy: chebyshev
    near_infinity_extra: true
    n_near_infinity: 32
    y_inf_min: -1.0
    y_inf_max: -0.95
    y_eps: 1.0e-3

  output_root: outputs/autoencoder_stage3_ubasis_refine

runtime:
  dtype: float64
