# Patch 0 retraining config - inherits from phase4_integral
# Key improvements:
#   1. More steps (30000 → more exploration)
#   2. Early stopping enabled
#   3. Anchor loss enabled for extreme-point supervision
#   4. Larger interior collocation points
include:
  physics: config/teukolsky_radial.yaml

atlas_training:
  steps: 30000
  lbfgs_steps: 800
  batch_size: 8
  n_interior: 192
  n_interior_outer_extra: 24
  grad_clip: 1.0
  normalize_residual: false

  integral_consistency_weight: 1.0
  integral_n_anchors: 32

  val_fraction: 0.2
  val_param_samples: 24
  val_every: 50
  val_n_points: 192

  early_stopping:
    enabled: true
    patience: 100
    min_rel_improve: 1.0e-5
    min_steps: 5000

  save_every: 200
  ckpt_every: 200
  viz_every: 200
  viz_num_points: 400
  viz_r_min: 2.0
  viz_r_max: 1000.0
  anchor_backend: pybhpt
  viz_benchmark_backend: spectral
  viz_pybhpt_timeout: 10.0
  anchor_pybhpt_timeout: 10.0
  viz_spectral_N: 64
  viz_spectral_z_m: 0.3
  viz_mma_enabled: false

  anchor_target_ratio: 5.0e-3
  train_seed: 1234
  output_root: outputs/atlas_patch_train_phase4_patch0_retrain
  anchor_fail_log_name: anchor_failures.jsonl

model:
  hidden_dims: [128, 128, 128, 128]
  activation: silu
  fourier_num_freqs: 2
  fourier_scale: 1.0
  param_embed_dim: 64
  use_film: true
  use_residual: true
  a_min_local: 0.001
  a_max_local: 0.999
  omega_min_local: 0.0001
  omega_max_local: 10.0

training:
  optimizer:
    lr: 5.0e-4

  scheduler:
    enabled: true
    type: exp_after_warmup
    warmup_steps: 5000
    decay_start: 2000
    decay_rate: 0.99995
    min_lr: 1.0e-5

  epochs: 50000

runtime:
  dtype: float64
