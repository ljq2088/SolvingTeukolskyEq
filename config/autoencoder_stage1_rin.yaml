include:
  physics: config/teukolsky_radial.yaml

# ============================================================
# Autoencoder Stage 1: R_in only (equivalence with old PINN_MLP)
# ============================================================

autoencoder:
  stage: stage1

model:
  hidden_dims: [128, 128, 128, 128]
  activation: silu
  fourier_num_freqs: 2
  fourier_base_scale: 1.0
  param_embed_dim: 64
  use_film: true
  use_residual: true

sampling:
  parameter_batch:
    mode: fixed_pool
    sampler: sobol
    batch_size: 4
    n_param_samples: 16

  collocation:
    interior:
      strategy: chebyshev
      n_points: 64

    boundary:
      strategy: none
      n_points: 0

    adaptive:
      enabled: false

  anchors:
    mode: none
    n_base: 0
    n_adaptive: 0
    n_random: 0

training:
  optimizer:
    lr: 5.0e-4

  anchor:
    freq: 0
    start_step: 999999
    n_anchors: 0

  scheduler:
    enabled: false

  loss:
    weight_interior: 1.0
    weight_boundary: 0.0
    weight_anchor: 0.0

  loss_balance:
    mode: fixed

  validation:
    mode: fixed_pool
    val_freq: 10
    val_n_points: 64
    n_param_samples: 8
    param_sampler: sobol
    monitor: mean
    track_worst: false
    sobol_seed: 4321
    sobol_skip: 0

  early_stop:
    patience: 2000
    threshold: 1.0e-6

  weight_schedule:
    interior:
      enabled: false

  epochs: 50000

curriculum:
  parameter:
    enabled: false
  collocation:
    enabled: false

regularization:
  anti_trivial:
    enabled: false
  dynamic_balance:
    enabled: false
  flat_variance:
    enabled: false
  head_reg:
    enabled: true
    weight_nl: 1.0e-6
    weight_resp: 1.0e-8
  param_curvature:
    enabled: true
    weight: 1.0e-4
    delta_alpha: 0.05
    delta_xi: 0.05
    n_probe_points: 64

restart:
  enabled: false

visualization:
  viz_show_enabled: false
  viz_enabled: false
  viz_save_enabled: false

runtime:
  dtype: float64

mathematica:
  kernel_path: "/mnt/f/mma/WolframKernel.exe"
  wl_path_win: "F:/EMRI/Radial_flow/Radial_Function.wl"

atlas_training:
  steps: 20
  batch_size: 4
  n_interior: 64
  n_interior_outer_extra: 0
  grad_clip: 1.0
  normalize_residual: false

  lbfgs_steps: 0

  val_fraction: 0.2
  val_param_samples: 8
  val_every: 10
  val_n_points: 64

  early_stopping:
    enabled: false

  save_every: 200
  ckpt_every: 200
  viz_every: 999999
  anchor_backend: pybhpt
  viz_benchmark_backend: none

  anchor_target_ratio: 1.0e-2
  train_seed: 1234
  output_root: outputs/autoencoder_stage1_rin
